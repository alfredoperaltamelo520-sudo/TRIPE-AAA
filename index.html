<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Juego 2D</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --accent: #fbbf24;
      --text: #e5e7eb;
      --muted: #cbd5e1;
      --green: #34d399;
      --red: #ef4444;
      --gold: #facc15;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(180deg, #020817, var(--bg));
      color: var(--text);
      font-family: Arial, sans-serif;
      display: grid;
      place-items: center;
    }

    .panel {
      text-align: center;
      max-width: 900px;
      width: 100%;
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 2.2rem;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .controls {
      margin-bottom: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: bold;
      background: var(--accent);
      color: #111827;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
    }

    canvas {
      display: block;
      margin: 0 auto;
      background: #1f2937;
      border: 4px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(251, 191, 36, 0.35);
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Mi juego 2D</h1>
    <p>Recoge monedas, evita enemigos y gana el nivel.</p>

    <div class="controls">
      <button id="startBtn">Jugar</button>
    </div>

    <canvas id="game" width="800" height="500"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');

    const player = {
      x: 60,
      y: 60,
      width: 28,
      height: 28,
      speed: 5,
      color: '#34d399'
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    const state = {
      score: 0,
      lives: 3,
      level: 1,
      maxLevels: 3,
      gameState: 'menu',
      msg: 'Pulsa Jugar'
    };

    let coins = [];
    let enemies = [];
    let invulnerableTimer = 0;

    function resetPlayer() {
      player.x = 50;
      player.y = 50;
    }

    function buildLevel(level) {
      coins = [];
      enemies = [];

      const configs = [
        {
          coins: [
            { x: 170, y: 120 },
            { x: 300, y: 260 },
            { x: 550, y: 150 },
            { x: 660, y: 360 }
          ],
          enemies: [
            { x: 240, y: 150, width: 24, height: 24, speed: 2, minX: 180, maxX: 520, minY: 120, maxY: 200 },
            { x: 520, y: 300, width: 24, height: 24, speed: 2.5, minX: 420, maxX: 700, minY: 240, maxY: 420 }
          ]
        },
        {
          coins: [
            { x: 120, y: 140 },
            { x: 260, y: 220 },
            { x: 430, y: 90 },
            { x: 560, y: 260 },
            { x: 700, y: 180 }
          ],
          enemies: [
            { x: 160, y: 330, width: 24, height: 24, speed: 2.2, minX: 110, maxX: 330, minY: 260, maxY: 430 },
            { x: 440, y: 360, width: 24, height: 24, speed: 2.8, minX: 360, maxX: 700, minY: 220, maxY: 420 },
            { x: 640, y: 100, width: 24, height: 24, speed: 2.4, minX: 560, maxX: 740, minY: 70, maxY: 200 }
          ]
        },
        {
          coins: [
            { x: 200, y: 100 },
            { x: 250, y: 200 },
            { x: 380, y: 130 },
            { x: 520, y: 240 },
            { x: 660, y: 120 },
            { x: 710, y: 360 }
          ],
          enemies: [
            { x: 120, y: 220, width: 26, height: 26, speed: 2.5, minX: 80, maxX: 240, minY: 170, maxY: 360 },
            { x: 300, y: 350, width: 26, height: 26, speed: 3, minX: 200, maxX: 540, minY: 260, maxY: 430 },
            { x: 560, y: 170, width: 26, height: 26, speed: 3.2, minX: 420, maxX: 740, minY: 100, maxY: 240 }
          ]
        }
      ];

      const config = configs[(level - 1) % configs.length];

      config.coins.forEach((coin) => {
        coins.push({
          x: coin.x,
          y: coin.y,
          size: 11,
          color: '#facc15'
        });
      });

      config.enemies.forEach((enemy) => {
        enemies.push({
          x: enemy.x,
          y: enemy.y,
          width: enemy.width,
          height: enemy.height,
          speed: enemy.speed,
          minX: enemy.minX,
          maxX: enemy.maxX,
          minY: enemy.minY,
          maxY: enemy.maxY,
          dx: 1,
          dy: 1,
          color: '#ef4444'
        });
      });
    }

    function startGame() {
      state.score = 0;
      state.lives = 3;
      state.level = 1;
      state.gameState = 'playing';
      state.msg = 'Nivel 1';
      resetPlayer();
      buildLevel(1);
      startBtn.textContent = 'Reiniciar';
    }

    function restartLevel() {
      resetPlayer();
      buildLevel(state.level);
      invulnerableTimer = 0;
    }

    function nextLevel() {
      if (state.level >= state.maxLevels) {
        state.gameState = 'won';
        state.msg = '¡Ganaste!';
        startBtn.textContent = 'Jugar de nuevo';
        return;
      }

      state.level += 1;
      state.msg = 'Nivel ' + state.level;
      resetPlayer();
      buildLevel(state.level);
    }

    function loseLife() {
      if (invulnerableTimer > 0) return;

      state.lives -= 1;
      invulnerableTimer = 120;

      if (state.lives <= 0) {
        state.gameState = 'gameover';
        state.msg = 'Game Over';
        startBtn.textContent = 'Jugar de nuevo';
        return;
      }

      resetPlayer();
    }

    function updatePlayer() {
      if (keys.ArrowUp) player.y -= player.speed;
      if (keys.ArrowDown) player.y += player.speed;
      if (keys.ArrowLeft) player.x -= player.speed;
      if (keys.ArrowRight) player.x += player.speed;

      player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.height, player.y));
    }

    function updateEnemies() {
      enemies.forEach((enemy) => {
        enemy.x += enemy.speed * enemy.dx;
        enemy.y += enemy.speed * enemy.dy;

        if (enemy.x <= enemy.minX || enemy.x + enemy.width >= enemy.maxX) {
          enemy.dx *= -1;
          enemy.x = Math.max(enemy.minX, Math.min(enemy.maxX - enemy.width, enemy.x));
        }

        if (enemy.y <= enemy.minY || enemy.y + enemy.height >= enemy.maxY) {
          enemy.dy *= -1;
          enemy.y = Math.max(enemy.minY, Math.min(enemy.maxY - enemy.height, enemy.y));
        }
      });
    }

    function checkCoinCollisions() {
      for (let i = coins.length - 1; i >= 0; i--) {
        const coin = coins[i];
        const hit =
          player.x < coin.x + coin.size &&
          player.x + player.width > coin.x &&
          player.y < coin.y + coin.size &&
          player.y + player.height > coin.y;

        if (hit) {
          coins.splice(i, 1);
          state.score += 10;
        }
      }
    }

    function checkEnemyCollisions() {
      enemies.forEach((enemy) => {
        const hit =
          player.x < enemy.x + enemy.width &&
          player.x + player.width > enemy.x &&
          player.y < enemy.y + enemy.height &&
          player.y + player.height > enemy.y;

        if (hit) {
          loseLife();
        }
      });
    }

    function update() {
      if (state.gameState !== 'playing') {
        return;
      }

      if (invulnerableTimer > 0) {
        invulnerableTimer -= 1;
      }

      updatePlayer();
      updateEnemies();
      checkCoinCollisions();
      checkEnemyCollisions();

      if (coins.length === 0) {
        nextLevel();
      }
    }

    function drawGrid() {
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
      ctx.lineWidth = 1;

      for (let x = 0; x < canvas.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }

      for (let y = 0; y < canvas.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);

      if (invulnerableTimer > 0 && Math.floor(invulnerableTimer / 8) % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(player.x - 2, player.y - 2, player.width + 4, player.height + 4);
      }
    }

    function drawCoins() {
      coins.forEach((coin) => {
        ctx.beginPath();
        ctx.fillStyle = coin.color;
        ctx.arc(coin.x, coin.y, coin.size, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function drawEnemies() {
      enemies.forEach((enemy) => {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
      });
    }

    function drawHud() {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 22px Arial';
      ctx.fillText('Puntaje: ' + state.score, 18, 28);
      ctx.fillText('Vidas: ' + state.lives, 670, 28);
      ctx.fillText('Nivel: ' + state.level, 350, 28);
    }

    function drawMenuOverlay() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.58)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 42px Arial';
      ctx.fillText('Juego 2D', 290, 200);

      ctx.font = '24px Arial';
      ctx.fillText('Mueve con flechas y recoge monedas', 180, 250);
      ctx.fillText('Evita a los enemigos', 285, 290);
      ctx.fillText('Pulsa Jugar para comenzar', 220, 340);
    }

    function drawEndOverlay() {
      ctx.fillStyle = 'rgba(2, 6, 23, 0.62)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#fef3c7';
      ctx.font = 'bold 42px Arial';
      ctx.fillText(state.msg, 285, 220);

      ctx.font = '24px Arial';
      ctx.fillText('Puntaje final: ' + state.score, 290, 270);
    }

    function draw() {
      drawGrid();
      drawCoins();
      drawEnemies();
      drawPlayer();
      drawHud();

      if (state.gameState === 'menu') {
        drawMenuOverlay();
      }

      if (state.gameState === 'gameover' || state.gameState === 'won') {
        drawEndOverlay();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (event) => {
      if (keys[event.key] !== undefined) {
        keys[event.key] = true;
      }
    });

    document.addEventListener('keyup', (event) => {
      if (keys[event.key] !== undefined) {
        keys[event.key] = false;
      }
    });

    startBtn.addEventListener('click', () => {
      if (state.gameState === 'playing') {
        startGame();
        return;
      }

      startGame();
    });

    draw();
    gameLoop();
  </script>
</body>
</html>
