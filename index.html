<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Isla de madera</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #0b2540;
      color: #f8fafc;
      font-family: Arial, sans-serif;
    }

    main {
      width: min(960px, 100%);
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin: 0 0 8px;
      color: #fde68a;
    }

    p {
      margin: 8px 0 14px;
      color: #dbeafe;
    }

    .hud {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .hud span {
      min-width: 130px;
      padding: 9px 14px;
      border: 1px solid #49718d;
      border-radius: 9px;
      background: #123451;
      font-weight: bold;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 4px solid #e7c785;
      border-radius: 14px;
      background: #38b9d1;
      box-shadow: 0 14px 38px #0007;
    }

    #message {
      min-height: 22px;
      color: #fef3c7;
      font-weight: bold;
    }

    @media (max-width: 560px) {
      main {
        padding: 12px 8px;
      }

      .hud {
        gap: 6px;
      }

      .hud span {
        min-width: 0;
        flex: 1;
        padding: 8px 5px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Isla de madera</h1>
    <p>Explora la isla, tala los árboles con tu hacha y recoge la madera.</p>
    <div class="hud" aria-live="polite">
      <span id="woodCount">Madera: 0</span>
      <span id="treeCount">Árboles: 8</span>
    </div>
    <canvas id="game" width="900" height="560" aria-label="Juego 2D de una isla"></canvas>
    <p id="message" aria-live="polite">Acércate a un árbol y pulsa E para talarlo.</p>
    <p>Moverte: flechas o WASD · Talar: E · Recoge los troncos caminando sobre ellos</p>
  </main>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const woodCount = document.getElementById('woodCount');
    const treeCount = document.getElementById('treeCount');
    const message = document.getElementById('message');

    const player = {
      x: 380,
      y: 382,
      radius: 13,
      speed: 190,
      directionX: 0,
      directionY: -1
    };

    const keys = new Set();
    const trees = [
      { x: 290, y: 155, hits: 0, shade: 0 },
      { x: 445, y: 135, hits: 0, shade: 0 },
      { x: 600, y: 165, hits: 0, shade: 0 },
      { x: 230, y: 275, hits: 0, shade: 0 },
      { x: 675, y: 310, hits: 0, shade: 0 },
      { x: 305, y: 410, hits: 0, shade: 0 },
      { x: 520, y: 425, hits: 0, shade: 0 },
      { x: 615, y: 365, hits: 0, shade: 0 }
    ];
    const woodPiles = [];

    let wood = 0;
    let chopCooldown = 0;
    let axeSwing = 0;
    let messageTimer = 0;
    let previousTime = 0;

    function tellPlayer(text, seconds = 2.5) {
      message.textContent = text;
      messageTimer = seconds;
    }

    function drawWater(time) {
      ctx.fillStyle = '#38b9d1';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let row = 0; row < 6; row += 1) {
        for (let col = 0; col < 11; col += 1) {
          const x = 35 + col * 84 + (row % 2) * 22;
          const y = 38 + row * 93 + Math.sin(time * 0.7 + col) * 5;
          ctx.beginPath();
          ctx.ellipse(x, y, 11, 3, -0.18, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(224, 250, 255, 0.3)';
          ctx.fill();
        }
      }
    }

    function drawIsland() {
      ctx.save();
      ctx.shadowColor = '#123b42';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetY = 10;
      ctx.beginPath();
      ctx.ellipse(450, 280, 405, 252, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#e8c47b';
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.ellipse(450, 278, 365, 217, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#78b957';
      ctx.fill();

      ctx.save();
      ctx.beginPath();
      ctx.ellipse(450, 278, 365, 217, 0, 0, Math.PI * 2);
      ctx.clip();
      for (let i = 0; i < 90; i += 1) {
        const x = 115 + ((i * 137) % 670);
        const y = 75 + ((i * 83) % 410);
        ctx.beginPath();
        ctx.arc(x, y, 1.5 + (i % 3), 0, Math.PI * 2);
        ctx.fillStyle = i % 2 ? 'rgba(40, 120, 59, 0.15)' : 'rgba(238, 223, 153, 0.2)';
        ctx.fill();
      }
      ctx.restore();

      for (let i = 0; i < 15; i += 1) {
        const angle = (i / 15) * Math.PI * 2;
        const x = 450 + Math.cos(angle) * 386;
        const y = 280 + Math.sin(angle) * 236;
        ctx.beginPath();
        ctx.ellipse(x, y, 9, 5, angle, 0, Math.PI * 2);
        ctx.fillStyle = '#8a9a8b';
        ctx.fill();
      }
    }

    function drawTree(tree, time) {
      const shake = tree.shade > 0 ? Math.sin(time * 45) * 4 : 0;
      ctx.save();
      ctx.translate(tree.x + shake, tree.y);

      ctx.beginPath();
      ctx.ellipse(4, 9, 29, 13, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(24, 66, 42, 0.28)';
      ctx.fill();

      ctx.fillStyle = '#87532e';
      ctx.fillRect(-8, -10, 16, 26);
      ctx.strokeStyle = '#bd8751';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-4, -6);
      ctx.lineTo(-4, 12);
      ctx.moveTo(3, -8);
      ctx.lineTo(3, 11);
      ctx.stroke();

      const leaves = [
        [-12, -22, 21, '#2f874b'],
        [10, -24, 23, '#287d45'],
        [0, -40, 24, '#369451'],
        [-1, -12, 20, '#3d9b55']
      ];
      leaves.forEach(([x, y, radius, color]) => {
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });

      ctx.beginPath();
      ctx.arc(-10, -29, 5, 0, Math.PI * 2);
      ctx.arc(8, -33, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#9b6335';
      ctx.fill();

      if (tree.hits > 0) {
        ctx.fillStyle = '#fff7c2';
        ctx.font = 'bold 13px Arial';
        ctx.textAlign = 'center';
        ctx.fillText((3 - tree.hits) + ' golpes', 0, -62);
      }
      ctx.restore();
    }

    function drawPlayer(time) {
      const moving = keys.size > 0;
      const walk = moving ? Math.sin(time * 13) * 2 : 0;
      const angle = Math.atan2(player.directionY, player.directionX) + Math.PI / 2;

      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(angle);

      ctx.beginPath();
      ctx.ellipse(2, 10, 15, 8, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(20, 60, 48, 0.27)';
      ctx.fill();

      ctx.fillStyle = '#27384a';
      ctx.fillRect(-8, 3 + walk, 6, 12);
      ctx.fillRect(2, 3 - walk, 6, 12);
      ctx.fillStyle = '#2756a5';
      ctx.fillRect(-11, -8, 22, 18);
      ctx.fillStyle = '#f0c59b';
      ctx.beginPath();
      ctx.arc(0, -14, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#553d2b';
      ctx.beginPath();
      ctx.arc(-1, -17, 9, Math.PI, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#f0c59b';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(9, -4);
      ctx.lineTo(14, 2);
      ctx.stroke();

      ctx.save();
      ctx.translate(15, 1);
      ctx.rotate(-axeSwing * 2.3);
      ctx.strokeStyle = '#81512e';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(0, -23);
      ctx.stroke();
      ctx.fillStyle = '#d8e0e5';
      ctx.beginPath();
      ctx.moveTo(-2, -20);
      ctx.lineTo(9, -26);
      ctx.lineTo(11, -17);
      ctx.lineTo(1, -15);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
      ctx.restore();
    }

    function drawWoodPile(pile, time) {
      ctx.save();
      ctx.translate(pile.x, pile.y + Math.sin(time * 3 + pile.x) * 2);
      ctx.fillStyle = 'rgba(31, 63, 48, 0.25)';
      ctx.beginPath();
      ctx.ellipse(0, 9, 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      for (let i = 0; i < 3; i += 1) {
        const y = (i - 1) * 8;
        ctx.fillStyle = '#86502b';
        ctx.fillRect(-16, y - 3, 31, 7);
        ctx.fillStyle = '#d6b07a';
        ctx.beginPath();
        ctx.ellipse(15, y, 3, 3.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function draw(time) {
      drawWater(time);
      drawIsland();
      trees.forEach((tree) => drawTree(tree, time));
      woodPiles.forEach((pile) => drawWoodPile(pile, time));
      drawPlayer(time);
    }

    function update(delta) {
      let x = 0;
      let y = 0;
      if (keys.has('ArrowLeft') || keys.has('a')) x -= 1;
      if (keys.has('ArrowRight') || keys.has('d')) x += 1;
      if (keys.has('ArrowUp') || keys.has('w')) y -= 1;
      if (keys.has('ArrowDown') || keys.has('s')) y += 1;

      const length = Math.hypot(x, y);
      if (length > 0) {
        x /= length;
        y /= length;
        player.directionX = x;
        player.directionY = y;
        const nextX = player.x + x * player.speed * delta;
        const nextY = player.y + y * player.speed * delta;

        const islandX = (nextX - 450) / 350;
        const islandY = (nextY - 278) / 202;
        if (islandX * islandX + islandY * islandY < 1) {
          player.x = nextX;
          player.y = nextY;
        }

        for (const tree of trees) {
          const dx = player.x - tree.x;
          const dy = player.y - tree.y;
          const distance = Math.hypot(dx, dy);
          if (distance < 33) {
            const directionX = distance === 0 ? 1 : dx / distance;
            const directionY = distance === 0 ? 0 : dy / distance;
            player.x = tree.x + directionX * 33;
            player.y = tree.y + directionY * 33;
          }
        }
      }

      chopCooldown = Math.max(0, chopCooldown - delta);
      axeSwing = Math.max(0, axeSwing - delta * 4.2);
      trees.forEach((tree) => {
        tree.shade = Math.max(0, tree.shade - delta);
      });

      for (let i = woodPiles.length - 1; i >= 0; i -= 1) {
        const pile = woodPiles[i];
        if (Math.hypot(player.x - pile.x, player.y - pile.y) < 27) {
          wood += 3;
          woodCount.textContent = 'Madera: ' + wood;
          woodPiles.splice(i, 1);
          tellPlayer('¡Recogiste 3 maderas!', 2);
        }
      }

      if (trees.length === 0 && woodPiles.length === 0) {
        tellPlayer('¡Isla despejada! Recogiste toda la madera.', 0);
      }

      if (messageTimer > 0) {
        messageTimer -= delta;
        if (messageTimer <= 0) {
          message.textContent = 'Acércate a un árbol y pulsa E para talarlo.';
        }
      }

    }

    function chopTree() {
      if (chopCooldown > 0) return;
      chopCooldown = 0.3;
      axeSwing = 1;

      let nearest = null;
      let nearestDistance = 54;
      trees.forEach((tree) => {
        const distance = Math.hypot(player.x - tree.x, player.y - tree.y);
        if (distance < nearestDistance) {
          nearest = tree;
          nearestDistance = distance;
        }
      });

      if (!nearest) {
        tellPlayer('Acércate a un árbol para usar el hacha.');
        return;
      }

      nearest.hits += 1;
      nearest.shade = 0.2;
      if (nearest.hits < 3) {
        tellPlayer('¡Golpe! Faltan ' + (3 - nearest.hits) + ' golpes.');
        return;
      }

      woodPiles.push({ x: nearest.x + 34, y: nearest.y + 4 });
      trees.splice(trees.indexOf(nearest), 1);
      treeCount.textContent = 'Árboles: ' + trees.length;
      tellPlayer('¡Árbol talado! Camina sobre los troncos para recogerlos.');
    }

    function gameLoop(timestamp) {
      const time = timestamp * 0.001;
      const delta = previousTime === 0 ? 0 : Math.min((timestamp - previousTime) / 1000, 0.05);
      previousTime = timestamp;
      update(delta);
      draw(time);
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener('keydown', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(key)) {
        event.preventDefault();
      }
      if (key === 'e' && !keys.has('e')) chopTree();
      keys.add(key);
    });

    window.addEventListener('keyup', (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      keys.delete(key);
    });

    window.addEventListener('blur', () => keys.clear());
    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
